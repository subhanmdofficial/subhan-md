services:
  - type: web
    name: subhan-md
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: SESSION_ID
        sync: false
      - key: PAIRING_NUMBER
        sync: false
      - key: BOT_NAME
        value: 𝐒ᴜʙʜᴀɴ-𝐌ᴅ
      - key: BOT_OWNER
        value: ᴍ sᴜʙʜᴀɴ ᴀʟɪ
      - key: PREFIXES
        value: .,!,/
      - key: COMMAND_MODE
        value: public
      - key: TIMEZONE
        value: Asia/Karachi
      - key: PORT
        value: 5000
